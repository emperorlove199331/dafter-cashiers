<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الكاشيرات</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --paper: #fbf9f5;
            --text-main: #2b2621;
            --text-sub: #736b5e;
            --primary: #8c2d19;
            --rust: #a94425;
            --brass: #d4af37;
            --green: #2d6a4f;
            --card-shadow: 0 4px 12px rgba(43, 38, 33, 0.08);
            --border-color: #e5dec9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        /* Header Navigation */
        header {
            background: var(--paper);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title { font-family: 'Readex Pro', sans-serif; font-size: 1.2rem; color: var(--primary); font-weight: 700; }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .btn-icon {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-icon:hover:not(:disabled) { background: var(--border-color); }

        /* Main Layout */
        main { padding: 20px; max-width: 800px; margin: 0 auto; }

        /* Card Styles */
        .card {
            background: var(--paper);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
        }

        .card-title {
            font-weight: 700;
            color: var(--rust);
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
        }

        /* Form Controls */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--rust); }

        .split-row { display: flex; gap: 8px; margin-bottom: 8px; }

        /* Logs Table */
        .log-item {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--paper);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .step-panel { display: none; }
        .step-panel.active { display: block; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">دفتر الكاشيرات 📖</div>
        <div class="header-actions">
            <button class="btn-icon" id="btn-undo" onclick="handleUndo()" disabled>↩️ تراجع</button>
            <button class="btn-icon" id="btn-redo" onclick="handleRedo()" disabled>↪️ تقدم</button>
            <button class="btn-icon" onclick="openSettings()">⚙️ الإعدادات</button>
        </div>
    </header>

    <main>
        <!-- قسم التمويل المركب والمعلق -->
        <div class="card">
            <div class="card-title">إضافة تمويل / تغذية 💰</div>
            <form id="funding-form" onsubmit="handleFundingSubmit(event)">
                <div class="form-group">
                    <label>المبلغ الإجمالي</label>
                    <input type="number" id="fund-amount" placeholder="مثال: 2000000" required oninput="validateMultiSplit()">
                </div>

                <div class="form-group">
                    <label>طريقة الخصم/التمويل</label>
                    <select id="fund-type" onchange="toggleFundingType()">
                        <option value="single">مصدر واحد</option>
                        <option value="multi">خصم متعدد (مركب)</option>
                        <option value="partial">تمويل جزئي (معلق)</option>
                    </select>
                </div>

                <!-- مصدر واحد -->
                <div id="single-source-container" class="form-group">
                    <label>المحفظة</label>
                    <select id="fund-wallet">
                        <option value="sham">شام كاش</option>
                        <option value="cash">كاش</option>
                    </select>
                </div>

                <!-- خصم متعدد -->
                <div id="multi-source-container" class="form-group" style="display:none;">
                    <label>تقسيم المصادر:</label>
                    <div class="split-row">
                        <input type="number" id="split-sham" placeholder="مبلغ شام كاش" oninput="validateMultiSplit()">
                        <input type="number" id="split-cash" placeholder="مبلغ الكاش" oninput="validateMultiSplit()">
                    </div>
                    <small id="split-warning" style="color:var(--rust); display:none; font-weight:bold;">⚠️ مجموع الخانات لا يساوي المبلغ الإجمالي</small>
                </div>

                <!-- تمويل جزئي معلق -->
                <div id="partial-source-container" class="form-group" style="display:none;">
                    <label>المبلغ المدفوع حالياً</label>
                    <input type="number" id="partial-paid" placeholder="المبلغ الذي سيُخصم الآن">
                    <label style="margin-top:8px;">خصم المدفوع من:</label>
                    <select id="partial-wallet">
                        <option value="sham">شام كاش</option>
                        <option value="cash">كاش</option>
                    </select>
                </div>

                <button type="submit" id="btn-submit-funding" class="btn-primary" style="margin-top: 10px;">حفظ التمويل</button>
            </form>
        </div>

        <!-- سجل الحركات والعمليات -->
        <div class="card">
            <div class="card-title">سجل العمليات الأخيرة 📋</div>
            <div id="activity-log-list">
                <p style="font-size:0.85rem; color:var(--text-sub); text-align:center;">لا توجد عمليات مسجلة حتى الآن.</p>
            </div>
        </div>
    </main>

    <!-- Modal الإعدادات -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="card-title">
                <span>الإعدادات</span>
                <span style="cursor:pointer;" onclick="closeModal('settings-modal')">✖</span>
            </div>
            <button class="btn-primary" onclick="startInitialBalanceWizard()" style="background: var(--green);">
                📊 ضبط الرصيد الافتتاحي
            </button>
        </div>
    </div>

    <!-- Modal الرصيد الافتتاحي -->
    <div class="modal" id="initial-balance-modal">
        <div class="modal-content">
            <!-- Step 1: الديون والمعلقات -->
            <div class="step-panel active" id="wizard-step-1">
                <div class="card-title">الخطوة 1: ديون الكاشيرات/اللاعبين السابقة</div>
                <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">أدخل الديون القديمة لتثبيتها دون أن تؤثر على المحافظ بالسالب.</p>
                <div id="debt-inputs-list">
                    <div class="split-row">
                        <input type="text" placeholder="اسم الكاشير/اللاعب" class="debt-name">
                        <input type="number" placeholder="المبلغ عليه" class="debt-val">
                    </div>
                </div>
                <button class="btn-icon" onclick="addDebtRow()" style="margin-bottom:12px;">+ إضافة اسم آخر</button>
                <button class="btn-primary" onclick="goToWizardStep(2)">التالي: أرصدة المحافظ ➔</button>
            </div>

            <!-- Step 2: أرصدة المحافظ -->
            <div class="step-panel" id="wizard-step-2">
                <div class="card-title">الخطوة 2: أرصدة المحافظ الحالية</div>
                <div class="form-group">
                    <label>رصيد شام كاش الافتتاحي</label>
                    <input type="number" id="init-sham-balance" placeholder="0">
                </div>
                <div class="form-group">
                    <label>رصيد الكاش الافتتاحي</label>
                    <input type="number" id="init-cash-balance" placeholder="0">
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-icon" onclick="goToWizardStep(1)">⬅ السابق</button>
                    <button class="btn-primary" onclick="saveInitialBalances()">حفظ واعتتماد الرصيد 💾</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- تهيئة Supabase بالشكل الصحيح 100% ---
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        
        // تصحيح الاستدعاء من CDN
        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Stacks للـ Undo / Redo
        let historyStack = [];
        let redoStack = [];

        function recordAction(actionType, data) {
            const entry = { type: actionType, data: data, timestamp: new Date().toLocaleTimeString('ar-EG') };
            historyStack.push(entry);
            redoStack = []; 
            updateUndoRedoUI();
            renderLogs();
            saveStateToSupabase(actionType, data);
        }

        function updateUndoRedoUI() {
            document.getElementById('btn-undo').disabled = historyStack.length === 0;
            document.getElementById('btn-redo').disabled = redoStack.length === 0;
        }

        async function handleUndo() {
            if (historyStack.length === 0) return;
            const lastAction = historyStack.pop();
            redoStack.push(lastAction);
            
            updateUndoRedoUI();
            renderLogs();
            await saveStateToSupabase('UNDO', lastAction);
        }

        async function handleRedo() {
            if (redoStack.length === 0) return;
            const actionToRedo = redoStack.pop();
            historyStack.push(actionToRedo);

            updateUndoRedoUI();
            renderLogs();
            await saveStateToSupabase('REDO', actionToRedo);
        }

        async function saveStateToSupabase(action, details) {
            try {
                await supabaseClient.from('activity_logs').insert([{ action, details }]);
            } catch (err) {
                console.log("إشعار: لم يتم الربط بـ Supabase الفعلي بعد.");
            }
        }

        function renderLogs() {
            const listContainer = document.getElementById('activity-log-list');
            if (historyStack.length === 0) {
                listContainer.innerHTML = `<p style="font-size:0.85rem; color:var(--text-sub); text-align:center;">لا توجد عمليات مسجلة حتى الآن.</p>`;
                return;
            }
            
            listContainer.innerHTML = historyStack.slice().reverse().map(item => `
                <div class="log-item">
                    <span><strong>${getTranslation(item.type)}</strong> - ${JSON.stringify(item.data)}</span>
                    <span style="color:var(--text-sub); font-size:0.75rem;">${item.timestamp}</span>
                </div>
            `).join('');
        }

        function getTranslation(type) {
            if (type === 'ADD_FUNDING') return 'تمويل جديد';
            if (type === 'SET_INITIAL_BALANCES') return 'رصيد افتتاحي';
            return type;
        }

        // --- التحكم في واجهات التمويل والتحقق ---
        function toggleFundingType() {
            const type = document.getElementById('fund-type').value;
            document.getElementById('single-source-container').style.display = type === 'single' ? 'block' : 'none';
            document.getElementById('multi-source-container').style.display = type === 'multi' ? 'block' : 'none';
            document.getElementById('partial-source-container').style.display = type === 'partial' ? 'block' : 'none';
            validateMultiSplit();
        }

        function validateMultiSplit() {
            const type = document.getElementById('fund-type').value;
            const total = parseFloat(document.getElementById('fund-amount').value) || 0;
            const submitBtn = document.getElementById('btn-submit-funding');
            const warning = document.getElementById('split-warning');

            if (type === 'multi') {
                const sham = parseFloat(document.getElementById('split-sham').value) || 0;
                const cash = parseFloat(document.getElementById('split-cash').value) || 0;
                
                if (sham + cash !== total && total > 0) {
                    warning.style.display = 'block';
                    submitBtn.disabled = true;
                } else {
                    warning.style.display = 'none';
                    submitBtn.disabled = false;
                }
            } else {
                warning.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        function handleFundingSubmit(e) {
            e.preventDefault();
            const total = parseFloat(document.getElementById('fund-amount').value);
            const type = document.getElementById('fund-type').value;

            let fundingPayload = { total, type };

            if (type === 'single') {
                fundingPayload.wallet = document.getElementById('fund-wallet').value;
            } else if (type === 'multi') {
                fundingPayload.sham = parseFloat(document.getElementById('split-sham').value) || 0;
                fundingPayload.cash = parseFloat(document.getElementById('split-cash').value) || 0;
            } else if (type === 'partial') {
                fundingPayload.paid = parseFloat(document.getElementById('partial-paid').value) || 0;
                fundingPayload.pending = total - fundingPayload.paid;
                fundingPayload.paidWallet = document.getElementById('partial-wallet').value;
            }

            recordAction('ADD_FUNDING', fundingPayload);
            document.getElementById('funding-form').reset();
            toggleFundingType();
        }

        // --- الرصيد الافتتاحي ---
        function openSettings() { document.getElementById('settings-modal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function startInitialBalanceWizard() {
            closeModal('settings-modal');
            document.getElementById('initial-balance-modal').classList.add('active');
            goToWizardStep(1);
        }

        function goToWizardStep(step) {
            document.querySelectorAll('.step-panel').forEach(el => el.classList.remove('active'));
            document.getElementById(`wizard-step-${step}`).classList.add('active');
        }

        function addDebtRow() {
            const container = document.getElementById('debt-inputs-list');
            const row = document.createElement('div');
            row.className = 'split-row';
            row.innerHTML = `<input type="text" placeholder="اسم الكاشير/اللاعب" class="debt-name">
                             <input type="number" placeholder="المبلغ عليه" class="debt-val">`;
            container.appendChild(row);
        }

        async function saveInitialBalances() {
            const debts = [];
            document.querySelectorAll('#debt-inputs-list .split-row').forEach(row => {
                const name = row.querySelector('.debt-name').value;
                const val = parseFloat(row.querySelector('.debt-val').value) || 0;
                if (name) debts.push({ name, debt: val });
            });

            const shamBal = parseFloat(document.getElementById('init-sham-balance').value) || 0;
            const cashBal = parseFloat(document.getElementById('init-cash-balance').value) || 0;

            const initialPayload = { debts, wallets: { sham: shamBal, cash: cashBal } };
            
            recordAction('SET_INITIAL_BALANCES', initialPayload);
            closeModal('initial-balance-modal');
        }
    </script>
</body>
</html>
